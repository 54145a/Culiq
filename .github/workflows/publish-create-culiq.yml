name: publish create-culiq

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Resolve version from tag
        id: meta
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify version matches tag
        working-directory: packages/create-culiq
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          if [[ "$pkg_version" != "${{ steps.meta.outputs.version }}" ]]; then
            echo "::error::package.json version ($pkg_version) does not match tag (${{ steps.meta.outputs.version }}) — bump the version in a commit before tagging"
            exit 1
          fi

      - name: Publish to npm
        working-directory: packages/create-culiq
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --ignore-scripts
