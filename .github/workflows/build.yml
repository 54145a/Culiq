name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        if: matrix.target == 'chrome'
        run: npm run check

      - name: Build extension (${{ matrix.target }})
        run: npm run build:${{ matrix.target }}

      - name: Resolve package version
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
            echo "tag=dev-${short_sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package archive
        id: pkg
        run: |
          mkdir -p artifacts
          ext="zip"
          if [[ "${{ matrix.target }}" == "firefox" ]]; then
            ext="xpi"
          fi
          out="curio-${{ steps.ver.outputs.tag }}-${{ matrix.target }}.${ext}"
          cd "dist-${{ matrix.target }}"
          zip -r "../artifacts/${out}" .
          cd ..
          echo "ext=${ext}" >> "$GITHUB_OUTPUT"
          ls -la artifacts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: curio-${{ steps.ver.outputs.tag }}-${{ matrix.target }}
          path: artifacts/*.${{ steps.pkg.outputs.ext }}
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: ls -la artifacts

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.xpi
          generate_release_notes: true
          fail_on_unmatched_files: true
