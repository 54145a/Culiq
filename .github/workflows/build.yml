name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: chrome
            ext: zip
          - target: firefox
            ext: xpi
    steps:
      - uses: actions/checkout@v5

      # Chrome MV3 accepts only 1-4 dot-separated integers, so a beta tag
      # (v1.3.0-beta.1) becomes manifest version 1.3.0; the beta lives on the tag
      # and in the GitHub release's prerelease flag.
      - name: Resolve tag and version
        id: meta
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.startsWith("refs/tags/") ? context.ref.replace("refs/tags/", "") : "";
            const match = /^v(\d+(?:\.\d+){0,3})(?:-[0-9A-Za-z.-]+)?$/.exec(tag);
            core.setOutput("tag", match ? tag : `dev-${context.sha.slice(0, 7)}`);
            core.setOutput("version", match ? match[1] : "");

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, type check and smoke tests
        if: matrix.target == 'chrome'
        run: pnpm lint && pnpm check && pnpm test

      - name: Build ${{ matrix.target }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: pnpm build:${{ matrix.target }}

      - name: Verify built manifest matches the tag
        if: steps.meta.outputs.version != ''
        run: node scripts/verify-manifest-version.mjs ${{ matrix.target }} ${{ steps.meta.outputs.version }}

      - name: Package ${{ matrix.ext }}
        run: |
          mkdir -p artifacts
          (cd dist-${{ matrix.target }} && zip -qr "../artifacts/culiq-${{ steps.meta.outputs.tag }}-${{ matrix.target }}.${{ matrix.ext }}" .)

      - uses: actions/upload-artifact@v7
        with:
          name: culiq-${{ steps.meta.outputs.tag }}-${{ matrix.target }}
          path: artifacts/*.${{ matrix.ext }}
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
