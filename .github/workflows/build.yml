name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Resolve package version
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          else
            short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
            echo "tag=dev-${short_sha}" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        if: matrix.target == 'chrome'
        run: npm run check

      - name: Build extension (${{ matrix.target }})
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: npm run build:${{ matrix.target }}

      - name: Package archive
        id: pkg
        run: |
          mkdir -p artifacts
          ext="zip"
          if [[ "${{ matrix.target }}" == "firefox" ]]; then
            ext="xpi"
          fi
          out="curio-${{ steps.ver.outputs.tag }}-${{ matrix.target }}.${ext}"
          cd "dist-${{ matrix.target }}"
          zip -r "../artifacts/${out}" .
          cd ..
          echo "ext=${ext}" >> "$GITHUB_OUTPUT"
          ls -la artifacts

      - name: Sign Firefox build (AMO unlisted, tag only)
        if: matrix.target == 'firefox' && startsWith(github.ref, 'refs/tags/v')
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          rm -rf signed
          npx web-ext sign \
            --source-dir=dist-firefox \
            --artifacts-dir=signed \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET" \
            --channel=unlisted
          signed_file=$(ls signed/*.xpi 2>/dev/null | head -n1)
          if [[ -z "$signed_file" ]]; then
            echo "::error::web-ext sign produced no .xpi"
            ls -la signed || true
            exit 1
          fi
          target="artifacts/curio-${{ steps.ver.outputs.tag }}-firefox.xpi"
          rm -f "$target"
          cp "$signed_file" "$target"
          echo "Signed xpi → $target"
          ls -la artifacts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: curio-${{ steps.ver.outputs.tag }}-${{ matrix.target }}
          path: artifacts/*.${{ steps.pkg.outputs.ext }}
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: ls -la artifacts

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.xpi
          generate_release_notes: true
          fail_on_unmatched_files: true
