name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: chrome
            ext: zip
          - target: firefox
            ext: xpi
    steps:
      - uses: actions/checkout@v4

      # Chrome MV3 accepts only 1-4 dot-separated integers, so a beta tag
      # (v1.3.0-beta.1) becomes manifest version 1.3.0; the beta lives on the tag
      # and in the GitHub release's prerelease flag.
      - name: Resolve tag and version
        id: meta
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.startsWith("refs/tags/") ? context.ref.replace("refs/tags/", "") : "";
            const match = /^v(\d+(?:\.\d+){0,3})(?:-[0-9A-Za-z.-]+)?$/.exec(tag);
            core.setOutput("tag", match ? tag : `dev-${context.sha.slice(0, 7)}`);
            core.setOutput("version", match ? match[1] : "");

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, type check and smoke tests
        if: matrix.target == 'chrome'
        run: pnpm lint && pnpm check && pnpm test

      - name: Build ${{ matrix.target }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: pnpm build:${{ matrix.target }}

      - name: Verify built manifest matches the tag
        if: steps.meta.outputs.version != ''
        run: node scripts/verify-manifest-version.mjs ${{ matrix.target }} ${{ steps.meta.outputs.version }}

      - name: Package ${{ matrix.ext }}
        run: |
          mkdir -p artifacts
          (cd dist-${{ matrix.target }} && zip -qr "../artifacts/culiq-${{ steps.meta.outputs.tag }}-${{ matrix.target }}.${{ matrix.ext }}" .)

      # AMO credentials are optional: without them the unsigned xpi ships instead,
      # so a release never hinges on the secrets being present. The signed xpi is
      # copied here rather than in a later step, because continue-on-error masks
      # the outcome (a failed sign still reports success).
      - name: Sign Firefox build (AMO unlisted)
        id: sign
        if: matrix.target == 'firefox' && steps.meta.outputs.version != ''
        continue-on-error: true
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [[ -z "$AMO_JWT_ISSUER" || -z "$AMO_JWT_SECRET" ]]; then
            echo "::warning::AMO credentials are not configured — releasing the unsigned xpi"
            exit 0
          fi
          pnpm exec web-ext sign \
            --source-dir=dist-firefox \
            --artifacts-dir=signed \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET" \
            --channel=unlisted
          cp signed/*.xpi "artifacts/culiq-${{ steps.meta.outputs.tag }}-firefox.xpi"

      - name: Report a failed AMO signing attempt
        if: steps.sign.outcome == 'failure'
        run: echo "::warning::AMO signing failed — releasing the unsigned xpi"

      - uses: actions/upload-artifact@v4
        with:
          name: culiq-${{ steps.meta.outputs.tag }}-${{ matrix.target }}
          path: artifacts/*.${{ matrix.ext }}
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
