<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Curio</title>
		<link rel="stylesheet" href="./style.css" />
	</head>
	<body>
		<header>
			<div class="brand">
				<h1>Curio</h1>
				<span id="status" data-state="pending">connecting…</span>
			</div>
			<nav role="tablist">
				<button type="button" role="tab" data-view="chat" aria-selected="true">Chat</button>
				<button type="button" role="tab" data-view="sessions" aria-selected="false">Sessions</button>
				<button type="button" role="tab" data-view="settings" aria-selected="false">Settings</button>
			</nav>
		</header>

		<section id="view-chat" class="view" data-active="true">
			<div class="chat-actions">
				<span id="chat-title"></span>
				<button id="new-session" type="button" title="Start a fresh conversation">+ New</button>
			</div>
			<ul id="log" aria-live="polite"></ul>
			<form id="form">
				<textarea id="input" rows="1" placeholder="ask the agent…  (Shift+Enter for newline)"></textarea>
				<button type="submit">send</button>
			</form>
		</section>

		<section id="view-sessions" class="view" data-active="false"></section>

		<section id="view-settings" class="view" data-active="false"></section>

		<script type="module" src="./main.ts"></script>
	</body>
</html>
